<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161922">
<title>电视浏览器助手2027 · 遥控器</title>
<style>
  :root {
    --bg: #12141b;
    --card: #1d212c;
    --card-2: #262b38;
    --line: #2f3545;
    --text: #f2f4f8;
    --muted: #9aa3b5;
    --accent: #ff6a00;
    --accent-2: #ff8a33;
    --ok: #2ecc71;
    --err: #ff5a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  header { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; }
  header .logo {
    width: 36px; height: 36px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    display: grid; place-items: center;
  }
  header h1 { font-size: 20px; margin: 0; font-weight: 700; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-left: auto; flex: none; }
  header .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(46,204,113,.18); }
  header .status { font-size: 13px; color: var(--muted); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; color: var(--muted); font-weight: 500; margin: 0 0 10px; }

  .now { display: flex; gap: 10px; align-items: center; min-height: 24px; }
  .now .t { flex: 1; min-width: 0; }
  .now .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .url { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  textarea {
    width: 100%; min-height: 96px; resize: vertical;
    background: var(--card-2); color: var(--text);
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font: inherit; font-size: 16px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 2px 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    border: 1.5px solid var(--line); background: var(--card-2); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,106,0,.16); color: #ffd2b0; }

  .row { display: flex; gap: 10px; }
  button.primary, button.secondary {
    border: 0; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer;
    padding: 14px 16px; font-size: 16px;
  }
  button.primary { flex: 1; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: #fff; }
  button.primary:active { filter: brightness(.92); }
  button.secondary { background: var(--card-2); color: var(--text); border: 1.5px solid var(--line); }
  button:disabled { opacity: .5; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key {
    background: var(--card-2); border: 1.5px solid var(--line); color: var(--text);
    border-radius: 14px; padding: 14px 6px; font: inherit; font-size: 14px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .key:active { background: #313748; border-color: var(--accent); }
  .key svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: #000c; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: #b3261ecc; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 22h8"/><path d="M10 9l5 2-5 2z" fill="#fff"/></svg>
    </div>
    <h1>电视浏览器助手2027</h1>
    <span class="dot" id="dot"></span>
    <span class="status" id="status">连接中…</span>
  </header>

  <section class="card">
    <h2>电视正在看</h2>
    <div class="now">
      <div class="t">
        <div class="title" id="nowTitle">—</div>
        <div class="url" id="nowUrl"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>在电视上打开</h2>
    <textarea id="text" placeholder="粘贴网址，或输入想看的片名&#10;也可以直接粘贴 B站 / 腾讯视频 App 里「分享 → 复制链接」的整段文字"></textarea>
    <div class="hint">有网址就直接打开网址；没有网址就按下面选的网站搜索</div>
    <div class="chips" id="engines" role="group" aria-label="搜索网站">
      <button class="chip" data-e="bilibili">B站</button>
      <button class="chip" data-e="qq">腾讯视频</button>
      <button class="chip" data-e="iqiyi">爱奇艺</button>
      <button class="chip" data-e="youku">优酷</button>
      <button class="chip" data-e="baidu">百度</button>
    </div>
    <div class="row">
      <button class="primary" id="open">在电视上打开</button>
      <button class="secondary" id="fav" title="把网址加到电视首页">收藏</button>
    </div>
  </section>

  <section class="card">
    <h2>遥控</h2>
    <div class="grid">
      <button class="key" data-k="playpause"><svg viewBox="0 0 24 24"><path d="M6 4l8 8-8 8z"/><path d="M16 5v14M20 5v14"/></svg>播放/暂停</button>
      <button class="key" data-k="pageup"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>向上翻页</button>
      <button class="key" data-k="reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>重新加载</button>
      <button class="key" data-k="back"><svg viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>返回</button>
      <button class="key" data-k="pagedown"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>向下翻页</button>
      <button class="key" data-k="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>电视首页</button>
    </div>
  </section>

  <footer>手机和电视需连接同一个 Wi‑Fi · 可以把本页添加到手机桌面</footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var engine = 'bilibili';
  try { engine = localStorage.getItem('engine') || engine; } catch (e) {}

  function renderEngines() {
    [].forEach.call(document.querySelectorAll('#engines .chip'), function (c) {
      c.setAttribute('aria-pressed', c.dataset.e === engine ? 'true' : 'false');
    });
  }
  renderEngines();
  $('engines').addEventListener('click', function (ev) {
    var c = ev.target.closest('.chip');
    if (!c) return;
    engine = c.dataset.e;
    try { localStorage.setItem('engine', engine); } catch (e) {}
    renderEngines();
  });

  var toastTimer;
  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast' + (isErr ? ' err' : ''); }, 2000);
  }

  function post(path, data) {
    var body = Object.keys(data).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(data[k] == null ? '' : data[k]);
    }).join('&');
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body
    }).then(function (r) { return r.json(); });
  }

  $('open').addEventListener('click', function () {
    var text = $('text').value.trim();
    if (!text) { toast('先输入网址或片名', true); $('text').focus(); return; }
    var btn = this; btn.disabled = true;
    post('/api/open', { text: text, engine: engine })
      .then(function (r) { r.ok ? toast('已在电视上打开') : toast(r.msg || '打开失败', true); })
      .catch(function () { toast('连不上电视，请确认电视上的「电视浏览器助手2027」已打开', true); })
      .then(function () { btn.disabled = false; setTimeout(refresh, 1500); });
  });

  $('fav').addEventListener('click', function () {
    var text = $('text').value.trim();
    if (!text) { toast('先输入要收藏的网址', true); return; }
    var name = prompt('在电视首页显示的名字（最多 8 个字）', '');
    if (name === null) return;
    post('/api/bookmark', { text: text, name: name })
      .then(function (r) { r.ok ? toast('已加到电视首页') : toast(r.msg || '收藏失败', true); })
      .catch(function () { toast('连不上电视', true); });
  });

  document.querySelector('.grid').addEventListener('click', function (ev) {
    var k = ev.target.closest('.key');
    if (!k) return;
    if (navigator.vibrate) navigator.vibrate(10);
    post('/api/key', { k: k.dataset.k }).catch(function () { toast('连不上电视', true); });
  });

  function refresh() {
    fetch('/api/state', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        $('dot').className = 'dot on';
        $('status').textContent = '已连接';
        $('nowTitle').textContent = s.title || (s.home ? '电视首页' : '—');
        $('nowUrl').textContent = s.url || '';
      })
      .catch(function () {
        $('dot').className = 'dot';
        $('status').textContent = '未连接';
      });
  }
  refresh();
  setInterval(refresh, 4000);
</script>
</body>
</html>
